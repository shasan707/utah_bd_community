<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --green:#006a4e; --red:#f42a41; --cream:#faf7f0; --ink:#16211c; --sand:#e4ddcc; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:"Open Sans",Arial,sans-serif; font-size:14px; }
  .wrap { max-width:1000px; margin:0 auto; padding:22px 16px 60px; }
  h1 { font-family:"Montserrat",Arial,sans-serif; color:var(--green); font-size:22px; margin:0 0 4px; }
  .sub { color:#5a6660; font-size:13px; margin:0 0 16px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tabs button { border:0; border-radius:999px; padding:8px 16px; font-weight:700; cursor:pointer; background:#e3efe9; color:var(--green); }
  .tabs button.active { background:var(--green); color:#fff; }
  .panel { background:#fff; border:1px solid var(--sand); border-radius:14px; padding:14px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th { text-align:left; padding:8px; font-size:12px; text-transform:uppercase; color:#5a6660; border-bottom:2px solid var(--sand); }
  td { padding:8px; border-bottom:1px solid #f0ece1; }
  tr.stale td { background:#fdf1f2; }
  .btn { border:0; border-radius:999px; padding:6px 14px; font-weight:700; cursor:pointer; }
  .btn.green { background:var(--green); color:#fff; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.gray { background:#e8e4d8; color:var(--ink); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  input.search { padding:8px 12px; border:1px solid var(--sand); border-radius:999px; min-width:220px; }
  .msg { margin:10px 0; font-weight:600; color:var(--green); }
  .warn { background:#fdf1f2; border:1px solid #f6c7cc; color:#a3172a; padding:10px 14px; border-radius:12px; margin-bottom:14px; font-weight:600; }
  .hidden { display:none; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .b-PENDING { background:#fff3d6; color:#8a5a10; }
  .b-PAID { background:#e3efe9; color:var(--green); }
  .b-EXPIRED,.b-CANCELLED,.b-REFUNDED { background:#eee; color:#666; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BPAU Admin</h1>
  <p class="sub">Signed in as <?= adminEmail ?>. Every action is written to the audit log.</p>
  <div id="logonlybanner" class="warn hidden">
    Parser is in LOG-ONLY mode: payments are recorded but nothing is auto-confirmed.
    <button class="btn gray" onclick="toggleLogOnly(false)">Turn auto-confirm ON</button>
  </div>

  <div class="tabs">
    <button id="tab-pending" class="active" onclick="show('pending')">Pending</button>
    <button id="tab-unmatched" onclick="show('unmatched')">Unmatched payments</button>
    <button id="tab-mismatches" onclick="show('mismatches')">Mismatches</button>
    <button id="tab-all" onclick="show('all')">All registrations</button>
  </div>

  <div class="toolbar">
    <button class="btn gray" onclick="load()">Refresh</button>
    <button class="btn gray" onclick="newEntry()">+ New entry (walk-in / phone)</button>
    <button class="btn gray" onclick="exportCsv()">Export CSV</button>
    <input class="search hidden" id="search" placeholder="Search name / code / email" oninput="renderAll()">
  </div>

  <div class="msg hidden" id="msg"></div>
  <div class="panel" id="content">Loading...</div>
</div>

<script>
  var DATA = null;
  var VIEW = 'pending';

  function load() {
    document.getElementById('content').textContent = 'Loading...';
    google.script.run.withSuccessHandler(function (d) {
      DATA = d;
      document.getElementById('logonlybanner').classList.toggle('hidden', !d.log_only);
      render();
    }).withFailureHandler(fail).adminData();
  }

  function fail(e) { flash(e.message || String(e)); }
  function flash(text) {
    var m = document.getElementById('msg');
    m.textContent = text;
    m.classList.remove('hidden');
    setTimeout(function () { m.classList.add('hidden'); }, 6000);
  }

  function show(view) {
    VIEW = view;
    ['pending','unmatched','mismatches','all'].forEach(function (v) {
      document.getElementById('tab-' + v).classList.toggle('active', v === view);
    });
    document.getElementById('search').classList.toggle('hidden', view !== 'all');
    render();
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function money(n) { return '$' + Number(n || 0).toFixed(2); }

  function render() {
    if (!DATA) return;
    if (VIEW === 'pending') renderPending();
    else if (VIEW === 'unmatched') renderUnmatched();
    else if (VIEW === 'mismatches') renderMismatches();
    else renderAll();
  }

  function renderPending() {
    var rows = DATA.pending.map(function (r) {
      return '<tr class="' + (r.stale ? 'stale' : '') + '">' +
        '<td><b>' + esc(r.code) + '</b></td><td>' + esc(r.name) + '</td>' +
        '<td>' + money(r.amount_due) + '</td><td>' + r.age_hours + 'h' + (r.stale ? ' (stale)' : '') + '</td>' +
        '<td>' +
        '<button class="btn green" onclick="markPaid(\'' + esc(r.code) + '\',' + r.amount_due + ')">Mark Paid</button> ' +
        '<button class="btn red" onclick="voidCode(\'' + esc(r.code) + '\')">Void</button>' +
        '</td></tr>';
    }).join('');
    document.getElementById('content').innerHTML = DATA.pending.length
      ? '<table><tr><th>Code</th><th>Name</th><th>Due</th><th>Age</th><th></th></tr>' + rows + '</table>'
      : 'No pending registrations.';
  }

  function renderUnmatched() {
    var rows = DATA.unmatched.map(function (r) {
      return '<tr><td>' + esc(r.sender_name) + '</td><td>' + money(r.amount) + '</td>' +
        '<td>' + esc(r.memo_raw) + '</td>' +
        '<td>' + (r.suggested_code ? '<b>' + esc(r.suggested_code) + '</b>?' : '-') + '</td>' +
        '<td><button class="btn green" onclick="linkPayment(\'' + esc(r.confirmation_id) + '\',\'' + esc(r.suggested_code) + '\')">Link to code</button></td></tr>';
    }).join('');
    document.getElementById('content').innerHTML = DATA.unmatched.length
      ? '<table><tr><th>Sender</th><th>Amount</th><th>Memo</th><th>Suggested</th><th></th></tr>' + rows + '</table>'
      : 'No unmatched payments.';
  }

  function renderMismatches() {
    var rows = DATA.mismatches.map(function (r) {
      return '<tr><td><b>' + esc(r.code) + '</b></td><td>' + esc(r.name) + '</td>' +
        '<td>' + money(r.expected) + '</td><td>' + money(r.received) + '</td>' +
        '<td><button class="btn green" onclick="resolveMismatch(\'' + esc(r.code) + '\')">Accept received</button></td></tr>';
    }).join('');
    document.getElementById('content').innerHTML = DATA.mismatches.length
      ? '<table><tr><th>Code</th><th>Name</th><th>Expected</th><th>Received</th><th></th></tr>' + rows + '</table>'
      : 'No amount mismatches.';
  }

  function renderAll() {
    var q = document.getElementById('search').value.toLowerCase();
    var list = DATA.all.filter(function (r) {
      return !q || String(r.name).toLowerCase().indexOf(q) >= 0 ||
        String(r.code).toLowerCase().indexOf(q) >= 0 ||
        String(r.email).toLowerCase().indexOf(q) >= 0;
    });
    var rows = list.map(function (r) {
      return '<tr><td><b>' + esc(r.code) + '</b></td><td>' + esc(r.name) + '</td>' +
        '<td>' + esc(r.email) + '</td><td>' + money(r.amount_due) + '</td>' +
        '<td><span class="badge b-' + esc(r.status) + '">' + esc(r.status) + '</span></td>' +
        '<td>' +
        '<button class="btn gray" onclick="resend(\'' + esc(r.code) + '\')">Resend receipt</button> ' +
        '<button class="btn gray" onclick="adjust(\'' + esc(r.code) + '\',' + r.amount_due + ')">Adjust</button>' +
        '</td></tr>';
    }).join('');
    document.getElementById('content').innerHTML =
      '<table><tr><th>Code</th><th>Name</th><th>Email</th><th>Due</th><th>Status</th><th></th></tr>' + rows + '</table>';
  }

  function run(fnName, args) {
    var runner = google.script.run.withSuccessHandler(function (res) {
      flash(res || 'Done.');
      load();
    }).withFailureHandler(fail);
    runner[fnName].apply(runner, args);
  }

  function markPaid(code, due) {
    var method = prompt('Payment method for ' + code + ' (zelle / cash / venmo / check / comp):', 'cash');
    if (!method) return;
    var amount = prompt('Amount received:', due);
    if (amount === null) return;
    var note = prompt('Note (optional):', '') || '';
    run('adminMarkPaid', [code, method, Number(amount), note]);
  }

  function voidCode(code) {
    var reason = prompt('Reason for cancelling ' + code + ' (required):');
    if (!reason) return;
    run('adminVoid', [code, reason]);
  }

  function linkPayment(confirmationId, suggested) {
    var code = prompt('Link payment ' + confirmationId + ' to which code?', suggested || '');
    if (!code) return;
    run('adminLinkPayment', [confirmationId, code.trim().toUpperCase()]);
  }

  function resolveMismatch(code) {
    if (!confirm('Accept the received amount for ' + code + ' and send the receipt?')) return;
    var note = prompt('Note (optional):', '') || '';
    run('adminResolveMismatch', [code, 'accept', note]);
  }

  function resend(code) { run('adminResendReceipt', [code]); }

  function adjust(code, current) {
    var amount = prompt('New amount due for ' + code + ':', current);
    if (amount === null) return;
    var note = prompt('Reason (discount, comp, waiver...):', '') || '';
    run('adminAdjustAmount', [code, Number(amount), note]);
  }

  function newEntry() {
    var name = prompt('Name:'); if (!name) return;
    var phone = prompt('Phone:', '') || '';
    var email = prompt('Email (blank = none):', '') || '';
    var adults = prompt('Adults:', '1') || '0';
    var children = prompt('Children under 10:', '0') || '0';
    var type = prompt('Ticket type (professional / student):', 'professional') || 'professional';
    var coupons = prompt('Coupons:', '0') || '0';
    var donation = prompt('Donation $:', '0') || '0';
    var payNow = confirm('Mark as PAID right now (cash at the door)? Cancel = leave PENDING.');
    var method = 'cash';
    if (payNow) method = prompt('Method (cash / zelle / venmo / check / comp):', 'cash') || 'cash';
    run('adminCreateEntry', [{
      name: name, phone: phone, email: email, adults: adults, children: children,
      ticket_type: type, coupons_qty: coupons, donation: donation
    }, payNow, method]);
  }

  function exportCsv() {
    google.script.run.withSuccessHandler(function (csv) {
      var blob = new Blob([csv], { type: 'text/csv' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'bpau-registrations.csv';
      a.click();
    }).withFailureHandler(fail).adminExportCsv();
  }

  function toggleLogOnly(value) {
    if (!value && !confirm('Turn ON auto-confirm? Only do this after a clean week of log-only running.')) return;
    run('adminSetLogOnly', [value]);
  }

  load();
</script>
</body>
</html>
